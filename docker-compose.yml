name: tokenscope

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18.6-ts2.30.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tokenscope
    ports:
      - "127.0.0.1:${TOKENSCOPE_DB_PORT:-55432}:5432"
    volumes:
      - tokenscope-data:/home/postgres/pgdata
    healthcheck:
      # The temporary initialization server listens only on a Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tokenscope"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${TOKENSCOPE_IMAGE:-tokenscope:local}
    build: .
    environment:
      ConnectionStrings__tokenscope: Host=timescaledb;Port=5432;Database=tokenscope;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:${TOKENSCOPE_PORT:-5299}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  tokenscope-data:
